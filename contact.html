  <main class="main">
    <section id="contact" class="section pb-5" style="margin-top: 50px;">
      <div class="container">
        
        <div class="row mb-5 align-items-end">
          <div class="col-md-6" data-aos="fade-up">
            <h3>Contact</h3>
            <p class="mb-0" style="color: #666;">Feel free to drop me a message about anything you need. I'm always happy to chat and help out!</p>
          </div>
        </div>

        <div class="row">
          <div class="col-md-8 col-lg-8" data-aos="fade-up" data-aos-delay="100">
            <form action="https://formspree.io/f/xkjjonjv" method="post">
              
              <div class="row gy-4">
                <div class="col-md-6 form-group">
                  <label for="name" class="pb-2" style="font-size: 0.9rem;">Name</label>
                  <input type="text" name="name" class="form-control border-0 py-2" id="name" required="" style="background-color: #f4f4f4;">
                </div>
                <div class="col-md-6 form-group">
                  <label for="email" class="pb-2" style="font-size: 0.9rem;">Email</label>
                  <input type="email" class="form-control border-0 py-2" name="email" id="email" required="" style="background-color: #f4f4f4;">
                </div>
              </div>

              <div class="form-group mt-4">
                <label for="subject" class="pb-2" style="font-size: 0.9rem;">Subject</label>
                <input type="text" class="form-control border-0 py-2" name="subject" id="subject" required="" style="background-color: #f4f4f4;">
              </div>

              <div class="form-group mt-4">
                <label for="message" class="pb-2" style="font-size: 0.9rem;">Message</label>
                <textarea class="form-control border-0 py-2" name="message" rows="8" required="" style="background-color: #f4f4f4; resize: none;"></textarea>
              </div>

              <div class="mt-4 text-start">
                <button type="submit" class="btn px-4 py-2" style="background-color: #f4f4f4; border: 1px solid #ddd; color: #000; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px;">SEND MESSAGE</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </section>
  </main>
